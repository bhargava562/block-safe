# ============================================================
# BlockSafe Docker Compose — Local Development & Production
# ============================================================
# Usage:
#   docker compose up --build        (foreground)
#   docker compose up --build -d     (background)
#   docker compose logs -f           (tail logs)
#   docker compose down              (stop & remove)
# ============================================================

services:
  blocksafe-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bhargava93099/blocksafe-api:latest
    container_name: blocksafe-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - server/.env
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  blocksafe-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: bhargava93099/blocksafe-bot:latest
    container_name: blocksafe-bot
    restart: unless-stopped
    depends_on:
      blocksafe-api:
        condition: service_healthy
    env_file:
      - server/.env # Use same environment for shared keys
    environment:
      - BLOCKSAFE_API_URL=http://blocksafe-api:8000

  blocksafe-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        - VITE_SUPABASE_URL=${SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${SUPABASE_SERVICE_KEY}
    image: bhargava93099/blocksafe-dashboard:latest
    container_name: blocksafe-dashboard
    restart: unless-stopped
    ports:
      - "8081:80"
